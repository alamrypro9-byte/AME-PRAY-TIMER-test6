<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شاشة إقامة الصلاة - موقع الويب (نسخة الاختبار)</title>
    <style>
        /* شاشة سوداء تماماً وخالصة */
        body, html { 
            background-color: #000000; 
            margin: 0; 
            padding: 0;
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        #content-container {
            display: flex; 
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            color: #ffffff; 
        }

        .overlay {
            width: 100%; height: 100%;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            text-align: center;
            padding-bottom: 12vh; /* مساحة الأمان لرفع المحتوى ومنع تداخله مع الأسفل */
        }

        /* تنسيق أيقونة المسجد الأندلسي */
        .mosque-icon {
            width: 17vw; 
            max-width: 230px;
            margin-bottom: 20px;
            opacity: 0.95;
        }
        
        .clock { font-size: 7vw; font-weight: bold; color: #ffffff; margin-bottom: 5px; direction: ltr; }
        .date-info { font-size: 1.8vw; color: #ffffff; margin-bottom: 20px; line-height: 1.5; }
        
        .times-container {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
        }
        
        .time-box {
            background: rgba(255,255,255,0.1); 
            padding: 15px 30px; 
            border-radius: 10px; 
            border: 1px solid #ffffff;
            text-align: center;
        }
        .time-box .ar { font-size: 2.2vw; color: #ffffff; font-weight: bold; }
        .time-box .en { font-size: 1.5vw; color: #ffffff; direction: ltr; margin-top: 8px; }
        
        .prayer-info { margin: 5px 0; color: #ffffff; }
        .prayer-info .ar { font-size: 3vw; font-weight: bold; }
        .prayer-info .en { font-size: 2vw; direction: ltr; margin-top: 5px; }
        
        .iqamah-timer { 
            margin: 5px 0 12vh 0; /* إبقاء العداد والرسالة مرفوعين للأعلى */
            min-height: 12vw; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        
        .timer-display { 
            color: #ffff00; /* اللون الأصفر */
            font-weight: bold; 
            transition: all 0.3s ease;
            line-height: 1.2;
        }

        .footer { 
            font-size: 1.2vw; 
            color: #666; 
            position: absolute; 
            bottom: 20px; 
            width: 100%; 
            text-align: center; 
            line-height: 1.6;
            background-color: #000000; 
            padding: 5px 0;
        }
    </style>
</head>
<body>

    <div id="content-container">
        <div class="overlay">
            
            <!-- تصميم المسجد الأندلسي (مآذن مربعة عريضة، قبة مدببة، وأقواس) -->
            <svg class="mosque-icon" viewBox="0 0 140 110" xmlns="http://www.w3.org/2000/svg">
                <g fill="#ffffff">
                    <!-- قاعدة المسجد -->
                    <rect x="5" y="95" width="130" height="15" rx="2" />
                    <!-- هيكل المصلى الأساسي -->
                    <rect x="26" y="70" width="88" height="25" />

                    <!-- رواق الأقواس الأندلسية (مفرغة باللون الأسود) -->
                    <path d="M 33 100 L 33 85 Q 38 78 43 85 L 43 100 Z" fill="#000000" />
                    <path d="M 48 100 L 48 85 Q 53 78 58 85 L 58 100 Z" fill="#000000" />
                    <path d="M 82 100 L 82 85 Q 87 78 92 85 L 92 100 Z" fill="#000000" />
                    <path d="M 97 100 L 97 85 Q 102 78 107 85 L 107 100 Z" fill="#000000" />

                    <!-- الباب الرئيسي المقوس (أكبر وأوسع) -->
                    <path d="M 62 100 L 62 82 Q 70 72 78 82 L 78 100 Z" fill="#000000" />

                    <!-- القبة الأندلسية الرئيسية (مدببة) -->
                    <path d="M 35 70 Q 35 45 70 35 Q 105 45 105 70 Z" />
                    <!-- عمود وهلال القبة الرئيسية -->
                    <rect x="69" y="20" width="2" height="15" />
                    <path d="M 70 12 A 5 5 0 1 1 65 17 A 6 6 0 1 0 70 12 Z" />

                    <!-- المئذنة اليسرى الأندلسية (مربعة وعريضة) -->
                    <rect x="10" y="30" width="16" height="65" />
                    <!-- نوافذ المئذنة -->
                    <path d="M 14 75 L 14 45 Q 18 40 22 45 L 22 75 Z" fill="#000000" />
                    <!-- شرفة المئذنة اليسرى -->
                    <rect x="8" y="25" width="20" height="5" rx="1" />
                    <rect x="12" y="12" width="12" height="13" />
                    <path d="M 12 12 Q 18 2 24 12 Z" />
                    <!-- هلال المئذنة اليسرى -->
                    <rect x="17.5" y="5" width="1" height="7" />
                    <path d="M 18 1 A 2.5 2.5 0 1 1 15 4.5 A 3 3 0 1 0 18 1 Z" />

                    <!-- المئذنة اليمنى الأندلسية (مربعة وعريضة) -->
                    <rect x="114" y="30" width="16" height="65" />
                    <!-- نوافذ المئذنة -->
                    <path d="M 118 75 L 118 45 Q 122 40 126 45 L 126 75 Z" fill="#000000" />
                    <!-- شرفة المئذنة اليمنى -->
                    <rect x="112" y="25" width="20" height="5" rx="1" />
                    <rect x="116" y="12" width="12" height="13" />
                    <path d="M 116 12 Q 122 2 128 12 Z" />
                    <!-- هلال المئذنة اليمنى -->
                    <rect x="121.5" y="5" width="1" height="7" />
                    <path d="M 122 1 A 2.5 2.5 0 1 1 119 4.5 A 3 3 0 1 0 122 1 Z" />
                </g>
            </svg>

            <div class="clock" id="current-time">00:00:00</div>
            <div class="date-info">
                <div id="date-ar">جاري التحضير...</div>
                <div id="date-en" dir="ltr">Loading...</div>
            </div>
            
            <div class="times-container">
                <div class="time-box">
                    <div class="ar" id="adhan-time-ar">وقت الأذان: --:--</div>
                    <div class="en" id="adhan-time-en">Adhan Time: --:--</div>
                </div>
                <div class="time-box">
                    <div class="ar" id="iqamah-time-ar">وقت الإقامة: --:--</div>
                    <div class="en" id="iqamah-time-en">Iqamah Time: --:--</div>
                </div>
            </div>
            
            <div class="prayer-info">
                <div class="ar" id="prayer-info-ar"></div>
                <div class="en" id="prayer-info-en"></div>
            </div>
            
            <div class="iqamah-timer">
                <div class="timer-display" id="dynamic-display"></div>
            </div>
            
            <div class="footer">
                الموقع: جبل علي، دبي (نسخة تجريبية للموقع) | تحديث المواقيت يتم تلقائياً<br>
                <span dir="ltr">Location: Jebel Ali, Dubai (Web Test Mode) | Timings updated automatically</span>
            </div>
        </div>
    </div>

    <script>
        let schedule = [];
        let currentlyDisplayedPrayer = "";
        const prayerNamesEn = { 'الظهر': 'Dhuhr', 'العصر': 'Asr' };

        function formatTime12(dateObj) {
            return dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        async function fetchPrayerTimes() {
            let timings;
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const date = now.getDate();

            try {
                const response = await fetch('https://api.aladhan.com/v1/timingsByAddress?address=Jebel+Ali,+Dubai,+UAE&method=8');
                const data = await response.json();
                timings = data.data.timings;
                
                document.getElementById('date-ar').innerText = data.data.date.hijri.weekday.ar + " | " + data.data.date.hijri.day + " " + data.data.date.hijri.month.ar + " " + data.data.date.hijri.year;
                document.getElementById('date-en').innerText = data.data.date.gregorian.weekday.en + " | " + data.data.date.gregorian.day + " " + data.data.date.gregorian.month.en + " " + data.data.date.gregorian.year;

            } catch (error) {
                console.log("No internet. Using Offline Mode.");
                timings = { Dhuhr: "12:15", Asr: "15:35" }; 
                
                const optionsEn = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('date-ar').innerText = "التاريخ المحلي (بدون إنترنت)";
                document.getElementById('date-en').innerText = now.toLocaleDateString('en-US', optionsEn);
            }

            function parseTime(timeStr) {
                const [h, m] = timeStr.split(':');
                return new Date(year, month, date, parseInt(h), parseInt(m), 0);
            }

            schedule = [
                { name: 'الظهر', adhan: parseTime(timings.Dhuhr), iqamah: new Date(year, month, date, 13, 0, 0) }, 
                { name: 'العصر', adhan: parseTime(timings.Asr), iqamah: new Date(year, month, date, 16, 30, 0) },
                { name: 'الظهر', adhan: new Date(parseTime(timings.Dhuhr).getTime() + 86400000), iqamah: new Date(year, month, date + 1, 13, 0, 0) }, 
                { name: 'العصر', adhan: new Date(parseTime(timings.Asr).getTime() + 86400000), iqamah: new Date(year, month, date + 1, 16, 30, 0) }
            ];
            
            updateScreen();
        }

        function updateScreen() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString('en-US', { hour12: true });

            if (schedule.length === 0) return;

            let activePrayer = schedule[0];
            let currentState = 'COUNTDOWN'; 

            for (let prayer of schedule) {
                const hideTime = new Date(prayer.iqamah.getTime() + (10 * 60000));
                if (now < hideTime) {
                    activePrayer = prayer;
                    currentState = (now < prayer.iqamah) ? 'COUNTDOWN' : 'PRAYING';
                    break;
                }
            }
            
            if (currentlyDisplayedPrayer !== activePrayer.name) {
                const adhanStr = formatTime12(activePrayer.adhan);
                const iqamahStr = formatTime12(activePrayer.iqamah);
                const prayerNameEn = prayerNamesEn[activePrayer.name];

                document.getElementById('adhan-time-ar').innerHTML = `وقت أذان ${activePrayer.name}: &nbsp; <span dir="ltr">${adhanStr}</span>`;
                document.getElementById('adhan-time-en').innerHTML = `${prayerNameEn} Adhan: &nbsp; ${adhanStr}`;
                
                document.getElementById('iqamah-time-ar').innerHTML = `وقت إقامة ${activePrayer.name}: &nbsp; <span dir="ltr">${iqamahStr}</span>`;
                document.getElementById('iqamah-time-en').innerHTML = `${prayerNameEn} Iqamah: &nbsp; ${iqamahStr}`;

                currentlyDisplayedPrayer = activePrayer.name;
            }

            const infoArEl = document.getElementById('prayer-info-ar');
            const infoEnEl = document.getElementById('prayer-info-en');
            const dynamicDisplayEl = document.getElementById('dynamic-display');

            if (currentState === 'COUNTDOWN') {
                infoArEl.innerText = `الإقامة لصلاة ${activePrayer.name} بعد:`;
                infoEnEl.innerText = `Iqamah for ${prayerNamesEn[activePrayer.name]} prayer in:`;

                const diff = activePrayer.iqamah - now;
                const hours = Math.floor(diff / (1000 * 60 * 60)); 
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                const timerFormatted = `${hours > 0 ? String(hours).padStart(2, '0') + ':' : ''}${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                dynamicDisplayEl.style.fontSize = '9vw'; 
                dynamicDisplayEl.style.direction = 'ltr';
                dynamicDisplayEl.innerHTML = timerFormatted;
                
            } 
            else if (currentState === 'PRAYING') {
                infoArEl.innerText = `تقام صلاة ${activePrayer.name} الآن`;
                infoEnEl.innerText = `${prayerNamesEn[activePrayer.name]} prayer is in progress`;
                
                dynamicDisplayEl.style.fontSize = '4.5vw';
                dynamicDisplayEl.style.direction = 'rtl';
                dynamicDisplayEl.innerHTML = `أقيموا الصفوف وأطفئوا الهواتف<br><span style="font-size: 2.5vw; color: #ffff00;" dir="ltr">Straighten the rows and turn off your phones</span>`;
            }
        }

        fetchPrayerTimes();
        setInterval(fetchPrayerTimes, 6 * 60 * 60 * 1000); 
        setInterval(updateScreen, 1000);
        
    </script>
</body>
</html>
